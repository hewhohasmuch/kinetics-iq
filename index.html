<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: no user scaling — this is a camera app, not a document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- PWA: standard -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KineticsIQ" />

    <!-- Theme color — matches background_color in manifest -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- iOS home screen icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- iOS splash screens (optional but polished) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>KineticsIQ</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
